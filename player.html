<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis | Player Uplink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; }
        .active-turn { border: 2px solid #34d399; background-color: rgba(52, 211, 153, 0.1); transform: scale(1.02); z-index: 10; }
        .input-dark { background-color: #1e293b; border: 1px solid #334155; color: white; padding: 8px; border-radius: 6px; outline: none; width: 100%; }
        .input-dark:focus { border-color: #6366f1; }

        /* --- NEW TAB STYLES --- */
        .tab-button {
            border-bottom: 3px solid transparent;
            color: #9ca3af; 
            transition: all 0.2s;
            flex: 1 1 0%;
            padding: 8px;
            font-weight: 600;
        }
        .tab-button.active {
            border-bottom: 3px solid #6366f1; /* Indigo focus color */
            color: #c7d2fe; /* Lighter text color when active */
        }
    </style>
</head>
<body class="p-4 max-w-md mx-auto">

    <div class="mb-6 text-center">
        <h1 class="text-2xl font-bold text-indigo-400 tracking-widest">BATTLE LINK</h1>
        <div id="status" class="text-xs text-gray-500">Connecting...</div>
    </div>
    
    <div class="flex border-b border-gray-700 mb-4">
        <button class="tab-button active" data-tab="combat-view" onclick="switchTab('combat-view', this)">⚔️ Combat</button>
        <button class="tab-button" data-tab="rules-view" onclick="switchTab('rules-view', this)">📖 D&D Rules</button>
    </div>
    <div id="combat-view" class="tab-content">
        
        <div id="join-form" class="bg-gray-800/50 p-4 rounded-xl border border-indigo-500/30 mb-6 shadow-lg">
            <h3 class="text-sm font-bold text-indigo-300 mb-3 uppercase tracking-wider">Join Initiative</h3>
            <div class="space-y-3">
                <div>
                    <label class="text-[10px] text-gray-400 uppercase font-bold">Character Name</label>
                    <input type="text" id="p-name" class="input-dark" placeholder="e.g. Aragorn">
                </div>
                <div class="grid grid-cols-3 gap-3">
                    <div><label class="text-[10px] text-gray-400 uppercase font-bold">Init</label><input type="number" id="p-init" class="input-dark text-center" placeholder="d20"></div>
                    <div><label class="text-[10px] text-gray-400 uppercase font-bold">AC</label><input type="number" id="p-ac" class="input-dark text-center" placeholder="15"></div>
                    <div><label class="text-[10px] text-gray-400 uppercase font-bold">HP</label><input type="number" id="p-hp" class="input-dark text-center" placeholder="Max"></div>
                </div>
                <button onclick="window.sendCharacter()" id="btn-join" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg transition transform active:scale-95 flex justify-center items-center gap-2">
                    <span>🚀</span> Send to DM
                </button>
            </div>
        </div>

        <div class="border-t border-gray-700 pt-4">
            <h3 class="text-xs font-bold text-gray-500 uppercase mb-3 text-center">Live Turn Order</h3>
            <div id="combat-list" class="space-y-3 pb-10">
                <div class="text-center text-gray-600 italic text-sm">Waiting for data...</div>
            </div>
        </div>
        
    </div>
    <div id="rules-view" class="tab-content hidden">
        <div class="bg-gray-800/50 p-4 rounded-xl border border-indigo-500/30 shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-indigo-300">D&D 5e Basic Rules (SRD)</h2>
            <p class="text-sm text-gray-400 mb-4">A complete reference for core actions, spells, and equipment.</p>
            
            <div class="h-[70vh] bg-gray-900 rounded-lg overflow-hidden border border-gray-700">
                <iframe 
                    src="https://5thsrd.org/" 
                    style="width: 100%; height: 100%; border: none;"
                    title="D&D 5e Rules Reference">
                </iframe>
            </div>
        </div>
    </div>
        <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- TAB SWITCHING LOGIC (NEW) ---
        // Sets the active tab visually and hides/shows content
        window.switchTab = (tabId, button) => {
            // 1. Hide all tab content
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            
            // 2. Show the selected tab content
            document.getElementById(tabId).classList.remove('hidden');
            
            // 3. Deactivate all buttons
            document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
            
            // 4. Activate the clicked button
            button.classList.add('active');
        };
            
            
        // 1. SETUP
        const app = initializeApp({
            apiKey: "AIzaSyB6lyGYJzk70t1OJvzBn5uyJN_k2_5NKYg",
            projectId: "aegisdmtoolkit",
            appId: "1:654767294266:web:fbee20be7d458fb7d6f203"
        });
        const db = getFirestore(app);

        // 2. GET DM ID
        const urlParams = new URLSearchParams(window.location.search);
        const dmId = urlParams.get('dm');

        if (!dmId) {
            document.body.innerHTML = "<div class='text-center text-red-400 mt-10 p-4'>🚫 Error: Invalid Link.<br>Ask your DM for the Broadcast Link.</div>";
        } else {
            initPlayerView(dmId);
        }

        // 3. SEND LOGIC
        window.sendCharacter = async () => {
            const btn = document.getElementById('btn-join');
            const name = document.getElementById('p-name').value.trim();
            const init = parseInt(document.getElementById('p-init').value) || 0;
            const ac = parseInt(document.getElementById('p-ac').value) || 10;
            const hp = parseInt(document.getElementById('p-hp').value) || 10;

            if (!name) { alert("Please enter a name!"); return; }

            btn.disabled = true; btn.innerHTML = "Sending...";

            try {
                await addDoc(collection(db, 'artifacts', 'default', 'sessions', dmId, 'shared_combatants'), {
                    name, init, ac, maxHp: hp, currentHp: hp, initModifier: 0, conditions: []
                });
                btn.innerHTML = "✅ Added!"; btn.classList.replace('bg-indigo-600', 'bg-green-600');
                document.getElementById('p-name').value = ""; document.getElementById('p-init').value = "";
                setTimeout(() => {
                    btn.disabled = false; btn.innerHTML = "<span>🚀</span> Send Another";
                    btn.classList.replace('bg-green-600', 'bg-indigo-600');
                }, 2000);
            } catch (e) { alert("Error: " + e.message); btn.disabled = false; btn.innerHTML = "Try Again"; }
        };

        // 4. LISTEN LOGIC (Fixed)
        function initPlayerView(dmId) {
            document.getElementById('status').textContent = "● Connected to Session";
            const list = document.getElementById('combat-list');
            
            // Shared State Variables
            let currentTurn = -1;
            let combatants = [];

            // 🟢 SHARED RENDER FUNCTION
            function render() {
                list.innerHTML = "";
                if (combatants.length === 0) {
                    list.innerHTML = "<div class='text-center text-gray-600 mt-4'>Combat has not started...</div>";
                    return;
                }

                combatants.forEach((c, index) => {
                    const isActive = index === currentTurn;
                    // Removed healthPercent calculation as it's not rendered
                    
                    const div = document.createElement('div');
                    div.className = `bg-gray-800 rounded-lg p-3 shadow-lg transition-all duration-300 ${isActive ? 'active-turn shadow-green-900/40' : 'border border-gray-700 opacity-80'}`;
                    
                    const badges = (c.conditions || []).map(cond => `<span class="text-[9px] bg-red-900 text-red-200 px-1 rounded border border-red-700">${cond}</span>`).join(' ');

                    div.innerHTML = `
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="bg-gray-900 w-9 h-9 flex items-center justify-center rounded-lg font-bold text-indigo-400 border border-gray-700 text-lg">
                                    ${c.init}
                                </div>
                                <div>
                                    <div class="font-bold text-base ${isActive ? 'text-white' : 'text-gray-300'}">${c.name}</div>
                                    <div class="flex gap-1 mt-0.5">${badges}</div>
                                </div>
                            </div>
                            ${isActive ? '<span class="text-[10px] bg-green-900 text-green-300 px-2 py-1 rounded uppercase tracking-wider font-bold animate-pulse">Active Turn</span>' : ''}
                        </div>
                        
                    `; // Health bar HTML removed, and outer div class fixed.
                    list.appendChild(div);
                });
            }

            // LISTENER 1: TURN ORDER
            onSnapshot(doc(db, 'artifacts', 'default', 'sessions', dmId, 'singles', 'shared_combat_state'), (doc) => {
                if(doc.exists()) {
                    currentTurn = doc.data().currentTurnIndex || 0;
                    render(); // <--- Re-render when DM clicks Next
                }
            });

            // LISTENER 2: COMBATANT DATA
            onSnapshot(collection(db, 'artifacts', 'default', 'sessions', dmId, 'shared_combatants'), (snapshot) => {
                combatants = [];
                snapshot.forEach(doc => combatants.push({ id: doc.id, ...doc.data() }));
                combatants.sort((a, b) => (b.init || 0) - (a.init || 0));
                render(); // <--- Re-render when HP changes or new player joins
            });
        }
    </script>
</body>
</html>
